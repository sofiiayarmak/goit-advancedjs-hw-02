<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Timer Page</title>
    <script type="module" crossorigin src="/goit-advancedjs-hw-02/assets/vendor-BbSUbo7J.js"></script>
    <script type="module" crossorigin src="/goit-advancedjs-hw-02/assets/1-timer-BEcSXoyS.js"></script>
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-02/assets/vendor-C1gPI-5C.css">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-02/assets/styles-C0J2BwLw.css">
  </head>
  <body>
    <main>
      <div class="container">
        <div class="controls">
          <input type="text" id="datetime-picker" />
          <button type="button" data-start disabled>Start</button>
        </div>

        <div class="timer">
          <div class="field">
            <span class="value" data-days>00</span>
            <span class="label">Days</span>
          </div>
          <div class="field">
            <span class="value" data-hours>00</span>
            <span class="label">Hours</span>
          </div>
          <div class="field">
            <span class="value" data-minutes>00</span>
            <span class="label">Minutes</span>
          </div>
          <div class="field">
            <span class="value" data-seconds>00</span>
            <span class="label">Seconds</span>
          </div>
        </div>

        <a class="back-link" href="./index.html">Go back</a>

      </div>
    </main>

  </body>
</html>
