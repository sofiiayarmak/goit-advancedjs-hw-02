<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таймер зворотного відліку</title>
    <script type="module" crossorigin src="/goit-advancedjs-hw-02/assets/vendor-DOPLpFvu.js"></script>
    <script type="module" crossorigin src="/goit-advancedjs-hw-02/assets/1-timer-Bae-5YOT.js"></script>
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-02/assets/vendor-C1gPI-5C.css">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-02/assets/styles-DvPDDfy5.css">
  </head>
  <body>
    <main>
      <section>
        <a href="./index.html">Go back</a>
        <br /><br />

        <input type="text" id="datetime-picker" />
        <button type="button" data-start disabled>Start</button>

        <div class="timer">
          <div class="field">
            <span class="value" data-days>00</span>
            <span class="label">Days</span>
          </div>
          <div class="field">
            <span class="value" data-hours>00</span>
            <span class="label">Hours</span>
          </div>
          <div class="field">
            <span class="value" data-minutes>00</span>
            <span class="label">Minutes</span>
          </div>
          <div class="field">
            <span class="value" data-seconds>00</span>
            <span class="label">Seconds</span>
          </div>
        </div>
      </section>
    </main>

  </body>
</html>
