<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snackbar Generator</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <nav class="nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a class="nav-link" href="./1-timer.html">Timer</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="./2-snackbar.html">Snackbar</a>
        </li>
      </ul>
    </nav>

    <main>
      <div class="container">
        <load src="./partials/back-link.html" />

        <form class="form">
          <label class="form-label">
            Delay (ms)
            <input type="number" name="delay" name="delay" required />
          </label>

          <fieldset class="form-fieldset">
            <legend>State</legend>
            <label>
              <input type="radio" name="state" value="fulfilled" required />
              Fulfilled
            </label>
            <label>
              <input type="radio" name="state" value="rejected" required />
              Rejected
            </label>
          </fieldset>

          <button type="submit" class="submit-btn">Create notification</button>
        </form>
      </div>
    </main>

    <script type="module" src="./js/2-snackbar.js"></script>
  </body>
</html>
